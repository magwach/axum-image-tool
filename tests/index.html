<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axum Image Tool</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: 0.9rem 0 0.25rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    .check { display: flex; align-items: center; gap: 0.5rem; }
    .check input { width: auto; }
    button { margin-top: 1.2rem; padding: 0.6rem 1.2rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Image Tool</h1>
  <form action="/process" method="post" enctype="multipart/form-data" target="_blank">
    <label for="image">Image</label>
    <input id="image" name="image" type="file" accept="image/*" required>

    <label for="width">Width (px, optional)</label>
    <input id="width" name="width" type="number" min="1" max="8192">

    <label for="height">Height (px, optional)</label>
    <input id="height" name="height" type="number" min="1" max="8192">

    <label for="rotate">Rotate (clockwise)</label>
    <select id="rotate" name="rotate">
      <option value="0">None</option>
      <option value="90">90°</option>
      <option value="180">180°</option>
      <option value="270">270°</option>
    </select>

    <label for="format">Output format</label>
    <select id="format" name="format">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
    </select>

    <label class="check"><input type="checkbox" name="grayscale"> Convert to grayscale</label>

    <button type="submit">Process</button>
  </form>
</body>
</html>
